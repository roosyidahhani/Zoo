<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoo Vocab Matchmaking - 3 Levels</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@400;600&display=swap');

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #f0fdf4;
            user-select: none;
        }

        .title-font {
            font-family: 'Fredoka One', cursive;
        }

        .card {
            cursor: pointer;
            transition: all 0.2s ease;
            border: 4px solid white;
        }

        .card:hover:not(.matched) {
            transform: translateY(-3px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .selected {
            border-color: #fbbf24 !important;
            background-color: #fef3c7 !important;
            transform: scale(1.05);
        }

        .matched {
            opacity: 0.2;
            cursor: default;
            transform: scale(0.9);
            background-color: #e2e8f0 !important;
            border-color: #cbd5e1 !important;
        }

        @keyframes success-pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(0.9); }
        }

        .animate-success {
            animation: success-pop 0.4s ease-out forwards;
        }

        .level-tab {
            transition: all 0.3s;
        }
        
        .level-active {
            background-color: #15803d;
            color: white;
            transform: scale(1.1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">

    <!-- Header -->
    <div class="text-center mt-6 mb-4">
        <h1 class="title-font text-4xl text-green-700 mb-1">Zoo Matchmaking! 🦁</h1>
        <p id="instruction" class="text-green-600 font-semibold italic">Hubungkan gambar dengan namanya!</p>
    </div>

    <!-- Level Selector -->
    <div class="flex gap-2 mb-6">
        <button onclick="changeLevel(1)" id="btn-lvl-1" class="level-tab px-4 py-2 rounded-full font-bold border-2 border-green-700 text-green-700">Level 1</button>
        <button onclick="changeLevel(2)" id="btn-lvl-2" class="level-tab px-4 py-2 rounded-full font-bold border-2 border-green-700 text-green-700">Level 2</button>
        <button onclick="changeLevel(3)" id="btn-lvl-3" class="level-tab px-4 py-2 rounded-full font-bold border-2 border-green-700 text-green-700">Level 3</button>
    </div>

    <!-- Stats Panel -->
    <div class="flex gap-4 sm:gap-8 mb-6 bg-white p-4 rounded-2xl shadow-md border-b-4 border-green-200 w-full max-w-md justify-between">
        <div class="text-center">
            <p class="text-xs uppercase text-gray-500 font-bold">Waktu</p>
            <p id="timer" class="text-xl font-bold text-green-600">00:00</p>
        </div>
        <div class="text-center border-l border-r px-4 flex-1">
            <p class="text-xs uppercase text-gray-500 font-bold">Progres</p>
            <p id="match-count" class="text-xl font-bold text-green-600">0 / 0</p>
        </div>
        <div class="text-center">
            <p class="text-xs uppercase text-gray-500 font-bold">Level</p>
            <p id="current-level-display" class="text-xl font-bold text-orange-500">1</p>
        </div>
    </div>

    <!-- Game Board -->
    <div id="game-board" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-3 max-w-4xl w-full">
        <!-- Cards inserted via JS -->
    </div>

    <!-- Win Modal -->
    <div id="win-modal" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl border-4 border-green-400">
            <div id="win-emoji" class="text-6xl mb-4">🦁</div>
            <h2 id="win-title" class="title-font text-3xl text-green-700 mb-2">Level Selesai!</h2>
            <p class="text-gray-600 mb-6" id="win-message"></p>
            <div class="flex flex-col gap-2">
                <button id="next-lvl-btn" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-xl transition transform active:scale-95 shadow-lg">
                    Lanjut Level Berikutnya
                </button>
                <button onclick="initGame()" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-3 px-6 rounded-xl transition">
                    Ulang Level Ini
                </button>
            </div>
        </div>
    </div>

    <script>
        const allAnimals = [
            // Level 1: Basic (4 pairs)
            [
                { id: 1, name: 'Lion', emoji: '🦁' },
                { id: 2, name: 'Monkey', emoji: '🐒' },
                { id: 3, name: 'Elephant', emoji: '🐘' },
                { id: 4, name: 'Zebra', emoji: '🦓' }
            ],
            // Level 2: Intermediate (8 pairs)
            [
                { id: 1, name: 'Lion', emoji: '🦁' },
                { id: 2, name: 'Monkey', emoji: '🐒' },
                { id: 3, name: 'Elephant', emoji: '🐘' },
                { id: 4, name: 'Zebra', emoji: '🦓' },
                { id: 5, name: 'Giraffe', emoji: '🦒' },
                { id: 6, name: 'Tiger', emoji: '🐅' },
                { id: 7, name: 'Panda', emoji: '🐼' },
                { id: 8, name: 'Snake', emoji: '🐍' }
            ],
            // Level 3: Advanced (12 pairs)
            [
                { id: 1, name: 'Lion', emoji: '🦁' },
                { id: 2, name: 'Monkey', emoji: '🐒' },
                { id: 3, name: 'Elephant', emoji: '🐘' },
                { id: 4, name: 'Zebra', emoji: '🦓' },
                { id: 5, name: 'Giraffe', emoji: '🦒' },
                { id: 6, name: 'Tiger', emoji: '🐅' },
                { id: 7, name: 'Panda', emoji: '🐼' },
                { id: 8, name: 'Snake', emoji: '🐍' },
                { id: 9, name: 'Crocodile', emoji: '🐊' },
                { id: 10, name: 'Hippo', emoji: '🦛' },
                { id: 11, name: 'Rhino', emoji: '🦏' },
                { id: 12, name: 'Kangaroo', emoji: '🦘' }
            ]
        ];

        let currentLevel = 1;
        let selectedCards = [];
        let matchedCount = 0;
        let timerSeconds = 0;
        let timerInterval = null;

        function changeLevel(lvl) {
            currentLevel = lvl;
            initGame();
        }

        function initGame() {
            // UI Setup
            clearInterval(timerInterval);
            timerInterval = null;
            timerSeconds = 0;
            matchedCount = 0;
            selectedCards = [];
            
            document.getElementById('win-modal').classList.add('hidden');
            document.getElementById('current-level-display').textContent = currentLevel;
            
            // Update Tab styles
            for(let i=1; i<=3; i++) {
                const btn = document.getElementById(`btn-lvl-${i}`);
                if(i === currentLevel) btn.classList.add('level-active');
                else btn.classList.remove('level-active');
            }

            const currentSet = allAnimals[currentLevel - 1];
            updateUI(currentSet.length);
            
            const board = document.getElementById('game-board');
            board.innerHTML = '';
            
            // Grid adjustment based on item count
            if (currentLevel === 3) {
                board.classList.remove('sm:grid-cols-4');
                board.classList.add('grid-cols-4', 'md:grid-cols-6');
            } else {
                board.classList.add('sm:grid-cols-4');
                board.classList.remove('md:grid-cols-6');
            }
            
            // Create cards
            const gameCards = [];
            currentSet.forEach(animal => {
                gameCards.push({ id: animal.id, type: 'text', content: animal.name });
                gameCards.push({ id: animal.id, type: 'emoji', content: animal.emoji });
            });

            gameCards.sort(() => Math.random() - 0.5);

            gameCards.forEach((cardData) => {
                const card = document.createElement('div');
                card.className = 'card bg-white h-20 sm:h-28 rounded-xl flex items-center justify-center text-lg sm:text-xl font-bold text-green-800 shadow-sm p-2 text-center';
                card.dataset.id = cardData.id;
                card.dataset.type = cardData.type;
                card.textContent = cardData.content;
                
                card.addEventListener('click', () => handleCardSelect(card));
                board.appendChild(card);
            });
        }

        function handleCardSelect(card) {
            if (card.classList.contains('matched')) return;
            if (!timerInterval) startTimer();

            if (selectedCards.includes(card)) {
                card.classList.remove('selected');
                selectedCards = [];
                return;
            }

            if (selectedCards.length === 1 && selectedCards[0].dataset.type === card.dataset.type) {
                selectedCards[0].classList.remove('selected');
                selectedCards = [card];
                card.classList.add('selected');
                return;
            }

            card.classList.add('selected');
            selectedCards.push(card);

            if (selectedCards.length === 2) {
                checkMatch();
            }
        }

        function checkMatch() {
            const [c1, c2] = selectedCards;
            const currentSet = allAnimals[currentLevel - 1];
            
            if (c1.dataset.id === c2.dataset.id) {
                c1.classList.remove('selected');
                c2.classList.remove('selected');
                c1.classList.add('matched', 'animate-success');
                c2.classList.add('matched', 'animate-success');
                
                matchedCount++;
                updateUI(currentSet.length);
                selectedCards = [];

                if (matchedCount === currentSet.length) endGame();
            } else {
                setTimeout(() => {
                    c1.classList.remove('selected');
                    c2.classList.remove('selected');
                    selectedCards = [];
                }, 300);
            }
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timerSeconds++;
                document.getElementById('timer').textContent = formatTime(timerSeconds);
            }, 1000);
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function updateUI(total) {
            document.getElementById('match-count').textContent = `${matchedCount} / ${total}`;
            document.getElementById('timer').textContent = formatTime(timerSeconds);
        }

        function endGame() {
            clearInterval(timerInterval);
            const modal = document.getElementById('win-modal');
            const nextBtn = document.getElementById('next-lvl-btn');
            
            if (currentLevel < 3) {
                document.getElementById('win-title').textContent = "Level Selesai!";
                document.getElementById('win-emoji').textContent = "🌟";
                nextBtn.textContent = "Lanjut Level " + (currentLevel + 1);
                nextBtn.onclick = () => { currentLevel++; initGame(); };
                nextBtn.classList.remove('hidden');
            } else {
                document.getElementById('win-title').textContent = "Luar Biasa!";
                document.getElementById('win-emoji').textContent = "🏆";
                document.getElementById('win-message').innerHTML += "<br>Kamu telah menamatkan semua level!";
                nextBtn.classList.add('hidden');
            }

            document.getElementById('win-message').innerHTML = `
                Kamu menyelesaikan Level ${currentLevel} dalam <br><b>${formatTime(timerSeconds)}</b>!
            `;
            modal.classList.remove('hidden');
        }

        window.onload = initGame;
    </script>
</body>
</html>
