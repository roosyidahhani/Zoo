<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fun English Snake and Ladder - 2 Players</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #f0f9ff;
            overflow-x: hidden;
        }
        .font-game { font-family: 'Fredoka One', cursive; }
        
        .board {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 4px;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            background: #cbd5e1;
            border: 8px solid #475569;
            border-radius: 12px;
            position: relative;
        }

        .cell {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            font-weight: bold;
            font-size: 1.2rem;
            position: relative;
            border-radius: 4px;
        }

        .cell-special { background: #fef08a; }
        .cell-start { background: #86efac; }
        .cell-end { background: #f87171; color: white; }

        .player-token {
            width: 25px;
            height: 25px;
            border: 3px solid white;
            border-radius: 50%;
            position: absolute;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        
        #player-1 { background: #ef4444; } /* Red */
        #player-2 { background: #3b82f6; } /* Blue */

        .btn-square {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            transition: transform 0.2s, background-color 0.2s;
        }
        .btn-square:active { transform: scale(0.95); }

        .modal {
            background: rgba(0,0,0,0.7);
            display: none;
            position: fixed;
            inset: 0;
            z-index: 50;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .active-turn {
            border: 4px solid #f59e0b;
            transform: scale(1.05);
        }
    </style>
</head>
<body class="p-4">

    <!-- Menu Screen -->
    <div id="menu-screen" class="max-w-md mx-auto text-center mt-10">
        <p class="text-blue-500 font-bold uppercase tracking-widest text-sm mb-2">Fun Learning Adventure</p>
        <h1 class="font-game text-4xl text-slate-800 mb-8">Snake & Ladder</h1>
        
        <p class="mb-6 text-slate-600">Click the game you want to play</p>
        
        <div class="grid grid-cols-2 gap-4 px-4">
            <button onclick="startGame()" class="btn-square bg-green-500 text-white hover:bg-green-600 shadow-lg">
                <span class="text-4xl mb-2">🎮</span>
                <span class="font-bold text-lg">2 Players</span>
            </button>
            <button onclick="showInstructions()" class="btn-square bg-blue-500 text-white hover:bg-blue-600 shadow-lg">
                <span class="text-4xl mb-2">📖</span>
                <span class="font-bold text-lg">How to Play</span>
            </button>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="hidden max-w-md mx-auto text-center">
        <!-- Turn Indicator & Scores -->
        <div class="grid grid-cols-2 gap-2 mb-4">
            <div id="card-p1" class="bg-white p-2 rounded-xl shadow-sm border-4 border-transparent transition-all">
                <div class="flex items-center gap-2 mb-1">
                    <div class="w-3 h-3 rounded-full bg-red-500"></div>
                    <p class="text-xs font-bold text-slate-400">PLAYER 1</p>
                </div>
                <p id="score-p1" class="font-game text-lg text-red-600">0</p>
            </div>
            <div id="card-p2" class="bg-white p-2 rounded-xl shadow-sm border-4 border-transparent transition-all">
                <div class="flex items-center gap-2 mb-1">
                    <div class="w-3 h-3 rounded-full bg-blue-500"></div>
                    <p class="text-xs font-bold text-slate-400">PLAYER 2</p>
                </div>
                <p id="score-p2" class="font-game text-lg text-blue-600">0</p>
            </div>
        </div>

        <!-- Board -->
        <div id="board" class="board mb-6">
            <div id="player-1" class="player-token"></div>
            <div id="player-2" class="player-token"></div>
        </div>

        <!-- Controls -->
        <div class="flex flex-col items-center gap-4">
            <div id="turn-announcer" class="bg-amber-100 text-amber-800 px-4 py-1 rounded-full text-sm font-bold animate-bounce">
                Giliran Player 1!
            </div>
            <div id="dice" class="w-16 h-16 bg-white border-4 border-slate-800 rounded-xl flex items-center justify-center text-3xl font-game shadow-md">
                ?
            </div>
            <button id="roll-btn" onclick="rollDice()" class="bg-indigo-600 text-white px-8 py-3 rounded-full font-game text-xl shadow-xl hover:bg-indigo-700 transition-all">
                ROLL DICE!
            </button>
        </div>
    </div>

    <!-- Question Modal -->
    <div id="question-modal" class="modal">
        <div class="bg-white rounded-3xl p-6 w-full max-w-sm text-center shadow-2xl">
            <p id="q-player-name" class="text-red-500 font-bold mb-1 uppercase">Player 1 Challenge!</p>
            <h2 id="q-category" class="font-game text-xl mb-4">Vocabulary</h2>
            
            <div id="q-image-container" class="mb-4 hidden">
                <div class="w-24 h-24 bg-slate-100 mx-auto rounded-full flex items-center justify-center text-4xl" id="q-emoji">
                    🐶
                </div>
            </div>
            
            <p id="q-text" class="text-lg font-bold mb-6 text-slate-700">What animal is this?</p>
            
            <div id="options-container" class="grid grid-cols-1 gap-3"></div>
        </div>
    </div>

    <!-- Win Modal -->
    <div id="win-modal" class="modal">
        <div class="bg-white rounded-3xl p-8 w-full max-w-sm text-center shadow-2xl border-t-8 border-green-500">
            <span class="text-6xl mb-4 block">🏆</span>
            <h2 id="winner-name" class="font-game text-3xl text-slate-800 mb-2">Player 1 Wins!</h2>
            <p class="text-slate-600 mb-6 text-lg">Fantastic job!</p>
            <button onclick="resetGame()" class="w-full bg-orange-500 text-white py-4 rounded-2xl font-game text-xl shadow-lg">
                PLAY AGAIN
            </button>
        </div>
    </div>

    <script>
        const BOARD_SIZE = 30;
        let players = [
            { id: 1, pos: 1, score: 0, color: '#ef4444' },
            { id: 2, pos: 1, score: 0, color: '#3b82f6' }
        ];
        let currentPlayerIdx = 0;
        let isMoving = false;

        const jumps = {
            3: 12, 8: 18, 17: 25, // Ladders
            10: 4, 19: 7, 28: 15  // Snakes
        };

        const questions = [
            { type: 'Vocabulary', text: 'What animal is this?', emoji: '🐘', options: ['Elephant', 'Mouse', 'Cat'], correct: 0 },
            { type: 'Past Tense', text: 'Yesterday, I ___ a lion at the zoo.', options: ['See', 'Saw', 'Seeing'], correct: 1 },
            { type: 'Habitat', text: 'Where does a Whale live?', options: ['Forest', 'Desert', 'Ocean'], correct: 2 },
            { type: 'Vocabulary', text: 'What animal is this?', emoji: '🦁', options: ['Tiger', 'Lion', 'Bear'], correct: 1 },
            { type: 'Past Tense', text: 'He ___ to the jungle two days ago.', options: ['Go', 'Went', 'Gone'], correct: 1 },
            { type: 'Habitat', text: 'A Camel lives in the...', options: ['Swamp', 'Desert', 'Mountain'], correct: 1 },
            { type: 'Vocabulary', text: 'Which one is a bird?', options: ['Eagle', 'Shark', 'Monkey'], correct: 0 },
            { type: 'Past Tense', text: 'She ___ some milk this morning.', options: ['Drink', 'Drank', 'Drunk'], correct: 1 },
            { type: 'Habitat', text: 'Polar bears live in the...', options: ['Jungle', 'Arctic', 'Beach'], correct: 1 }
        ];

        const playSound = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                if(type === 'correct') {
                    osc.frequency.setValueAtTime(600, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.1);
                } else if(type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(200, ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(100, ctx.currentTime + 0.3);
                } else {
                    osc.frequency.setValueAtTime(150, ctx.currentTime);
                }
                gain.gain.setValueAtTime(0.05, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            } catch(e) {}
        };

        function createBoard() {
            const boardEl = document.getElementById('board');
            const p1 = document.getElementById('player-1');
            const p2 = document.getElementById('player-2');
            boardEl.innerHTML = '';
            boardEl.appendChild(p1);
            boardEl.appendChild(p2);

            for (let i = 1; i <= BOARD_SIZE; i++) {
                const cell = document.createElement('div');
                cell.className = `cell cell-${i}`;
                cell.id = `cell-${i}`;
                cell.innerText = i;
                if (i === 1) cell.classList.add('cell-start');
                if (i === BOARD_SIZE) cell.classList.add('cell-end');
                if (jumps[i]) cell.classList.add('cell-special');
                boardEl.appendChild(cell);
            }
        }

        function updateUI() {
            players.forEach(p => {
                const cell = document.getElementById(`cell-${p.pos}`);
                const token = document.getElementById(`player-${p.id}`);
                const offset = p.id === 1 ? -8 : 8;
                
                token.style.left = `${cell.offsetLeft + (cell.offsetWidth/2) - 12 + offset}px`;
                token.style.top = `${cell.offsetTop + (cell.offsetHeight/2) - 12 + offset}px`;
                
                document.getElementById(`score-p${p.id}`).innerText = p.score;
            });

            const currentP = players[currentPlayerIdx];
            document.getElementById('turn-announcer').innerText = `Giliran Player ${currentP.id}!`;
            document.getElementById('turn-announcer').style.color = currentP.color;
            
            document.getElementById('card-p1').classList.toggle('active-turn', currentPlayerIdx === 0);
            document.getElementById('card-p2').classList.toggle('active-turn', currentPlayerIdx === 1);
        }

        function startGame() {
            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            createBoard();
            setTimeout(updateUI, 100);
        }

        function rollDice() {
            if (isMoving) return;
            isMoving = true;
            document.getElementById('roll-btn').disabled = true;
            playSound('roll');

            let rolls = 0;
            const diceEl = document.getElementById('dice');
            const interval = setInterval(() => {
                diceEl.innerText = Math.floor(Math.random() * 6) + 1;
                rolls++;
                if (rolls > 10) {
                    clearInterval(interval);
                    const result = Math.floor(Math.random() * 6) + 1;
                    diceEl.innerText = result;
                    movePlayer(result);
                }
            }, 50);
        }

        async function movePlayer(steps) {
            const p = players[currentPlayerIdx];
            for (let i = 0; i < steps; i++) {
                if (p.pos >= BOARD_SIZE) break;
                p.pos++;
                updateUI();
                await new Promise(r => setTimeout(r, 400));
            }
            
            if (p.pos === BOARD_SIZE) {
                showWin(p.id);
            } else {
                showQuestion();
            }
        }

        function showQuestion() {
            const modal = document.getElementById('question-modal');
            const p = players[currentPlayerIdx];
            const q = questions[Math.floor(Math.random() * questions.length)];
            
            const nameLabel = document.getElementById('q-player-name');
            nameLabel.innerText = `Player ${p.id} Challenge!`;
            nameLabel.style.color = p.color;

            document.getElementById('q-category').innerText = q.type;
            document.getElementById('q-text').innerText = q.text;
            
            const imgContainer = document.getElementById('q-image-container');
            if (q.emoji) {
                imgContainer.classList.remove('hidden');
                document.getElementById('q-emoji').innerText = q.emoji;
            } else {
                imgContainer.classList.add('hidden');
            }
            
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "bg-slate-100 hover:bg-indigo-100 p-4 rounded-2xl font-bold text-slate-700 transition-colors border-2 border-transparent hover:border-indigo-300";
                btn.innerText = opt;
                btn.onclick = () => handleAnswer(idx === q.correct);
                container.appendChild(btn);
            });
            
            modal.style.display = 'flex';
        }

        function handleAnswer(isCorrect) {
            document.getElementById('question-modal').style.display = 'none';
            const p = players[currentPlayerIdx];
            
            if (isCorrect) {
                p.score += 10;
                playSound('correct');
                if (jumps[p.pos] && jumps[p.pos] > p.pos) {
                    setTimeout(() => { p.pos = jumps[p.pos]; updateUI(); }, 500);
                }
            } else {
                p.score = Math.max(0, p.score - 5);
                playSound('wrong');
                if (jumps[p.pos] && jumps[p.pos] < p.pos) {
                    setTimeout(() => { p.pos = jumps[p.pos]; updateUI(); }, 500);
                }
            }
            
            // Switch Turn
            currentPlayerIdx = (currentPlayerIdx + 1) % 2;
            
            setTimeout(() => {
                updateUI();
                document.getElementById('roll-btn').disabled = false;
                isMoving = false;
            }, 600);
        }

        function showWin(playerId) {
            document.getElementById('win-modal').style.display = 'flex';
            document.getElementById('winner-name').innerText = `Player ${playerId} Wins!`;
        }

        function resetGame() {
            players.forEach(p => { p.pos = 1; p.score = 0; });
            currentPlayerIdx = 0;
            document.getElementById('win-modal').style.display = 'none';
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('menu-screen').classList.remove('hidden');
            document.getElementById('roll-btn').disabled = false;
            isMoving = false;
        }

        function showInstructions() {
            const div = document.createElement('div');
            div.className = "fixed inset-0 bg-black bg-opacity-70 z-[100] flex items-center justify-center p-6";
            div.innerHTML = `
                <div class="bg-white p-6 rounded-3xl max-w-sm w-full text-center">
                    <h3 class="font-game text-2xl mb-4">Cara Bermain</h3>
                    <p class="text-slate-600 mb-6 text-left text-sm">
                        1. Player 1 (Merah) dan Player 2 (Biru) bergantian melempar dadu.<br><br>
                        2. Jika jawaban BENAR: Skor +10 dan bisa naik TANGGA.<br><br>
                        3. Jika jawaban SALAH: Skor -5 dan bisa turun ULAR!<br><br>
                        4. Pemain pertama yang sampai ke nomor 30 menang!
                    </p>
                    <button onclick="this.parentElement.parentElement.remove()" class="bg-blue-500 text-white font-game px-8 py-3 rounded-2xl w-full">Mengerti!</button>
                </div>
            `;
            document.body.appendChild(div);
        }

        window.onload = createBoard;
    </script>
</body>
</html>
